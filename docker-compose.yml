services:
  argus:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Optional: with a key Argus reasons with Claude; without one it uses the offline reasoner.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ARGUS_MODEL: ${ARGUS_MODEL:-anthropic:claude-opus-5-5}
      # Optional: require "Authorization: Bearer <token>" on every POST (incidents, decisions, webhooks).
      ARGUS_API_TOKEN: ${ARGUS_API_TOKEN:-}
      # Optional: LangSmith tracing of every graph run.
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
    volumes:
      - argus-data:/data
    restart: unless-stopped
volumes:
  argus-data:
