<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Argus · AI Incident Commander</title>
  <meta name="description" content="An AI incident commander built with LangGraph and LangChain: parallel investigators, a critic loop, human approval and verified remediation.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236250d6'/%3E%3Cstop offset='1' stop-color='%232a78d6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='1' y='1' width='30' height='30' rx='9' fill='url(%23g)'/%3E%3Cpath d='M5.5 16S9.5 9 16 9s10.5 7 10.5 7-4 7-10.5 7S5.5 16 5.5 16z' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3.6' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="static/styles.css">
  <script>
    try { const t = localStorage.getItem("argus.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open incident list"></button>
        <a class="brand" href="#/" id="brand"></a>
      </div>
      <div class="topbar-right">
        <span class="pill engine" id="enginePill" title="Reasoning engine used when 'Auto' is selected"><span class="dot"></span><span>…</span></span>
        <button class="icon-btn" id="themeBtn" aria-label="Toggle light / dark theme"></button>
      </div>
    </header>
    <aside class="rail" id="rail">
      <a class="btn btn-primary btn-block" href="#/" id="newBtn"></a>
      <div class="rail-title">Incidents</div>
      <ul class="inc-list" id="incList"></ul>
    </aside>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="tooltip" id="tooltip" role="tooltip"></div>
  <script type="module" src="static/app.js"></script>
</body>
</html>
