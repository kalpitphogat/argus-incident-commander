[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "argus-incident-commander"
version = "1.0.0"
description = "An AI incident commander built with LangGraph and LangChain: parallel investigators, a critic loop, human approval and verified remediation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Argus contributors" }]
keywords = ["langgraph", "langchain", "agents", "sre", "aiops", "incident-response", "claude"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "langchain>=1.4,<2",
  "langchain-core>=1.8,<2",
  "langchain-anthropic>=1.7.10,<2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6",
  "rich>=13",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0"]
google = ["langchain-google-genai>=3.0"]
ollama = ["langchain-ollama>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
argus = "argus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "tests"]
